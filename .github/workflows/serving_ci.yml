name: Serving API CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  test-serving:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint serving and per-cell model code
        run: |
          ruff check src/serving src/models/cell_model_bundle.py src/models/package_cell_model.py \
            src/features/cell_features.py src/evaluation/cell_backtest.py src/ingest/imd_cells.py tests/test_serving.py \
            tests/make_synthetic_model.py

      # Uses synthetic model bundles only: no DVC data or MLflow registry needed in CI.
      - name: Run serving, bundle and leakage tests
        run: |
          pytest tests/test_serving.py tests/test_main_model.py -v

  docker-image:
    runs-on: ubuntu-latest
    needs: test-serving

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CI has no registry, so the image is built around a synthetic model.
      - name: Create synthetic model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m tests.make_synthetic_model build/model

      - name: Build image
        run: |
          docker build --build-arg GIT_COMMIT="${GITHUB_SHA::7}" \
            --build-arg MODEL_NAME=synthetic_ci_model --build-arg MODEL_VERSION=0 \
            -t bengaluru-rainfall-api:ci .

      - name: Smoke-test the running container
        run: |
          docker run -d --name api -p 8000:8000 --read-only --tmpfs /tmp bengaluru-rainfall-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health | grep -q '"model_loaded":true'
          curl -sf -X POST localhost:8000/predict -H 'content-type: application/json' \
            -d '{"lat": 12.93, "lon": 77.58, "year": 2026, "month": 1}' | tee /tmp/pred.json
          grep -q '"basis":"forecast"' /tmp/pred.json
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/predict \
            -H 'content-type: application/json' -d '{"lat": 12.30, "lon": 76.64, "year": 2026, "month": 1}')
          test "$code" = "422"
          test "$(docker inspect -f '{{.State.Health.Status}}' api)" != "unhealthy"

      - name: Container logs
        if: always()
        run: docker logs api || true
